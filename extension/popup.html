<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row {
      margin-bottom: 12px;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      font-size: 12px;
      box-sizing: border-box;
    }
    .status {
      font-size: 11px;
      color: #34d399;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>⚡ Prompt Compiler</h2>
  <div class="row">
    <label>Backend Provider</label>
    <select id="provider">
      <option value="local">Local Offline Engine</option>
      <option value="azure">Azure AI Foundry (GPT-4.1 Mini)</option>
      <option value="vertex">GCP Vertex AI (Gemini 3.5 Flash)</option>
    </select>
  </div>
  <div class="row">
    <label>Theme</label>
    <select id="theme">
      <option value="system">Inherit System Default</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
  <div class="status">● Ready & active on LLM tabs</div>
</body>
</html>
